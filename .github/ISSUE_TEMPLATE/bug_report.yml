name: Bug report
description: Something does not work as described in the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting! English or German is fine. Please do not paste file or share names you would not
        want to be public.
  - type: input
    id: version
    attributes:
      label: FileDetective version
      description: Settings > About shows it, e.g. 0.3.0.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: e.g. Windows 11 24H2 (Win+R, `winver`).
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options:
        - Installer (setup.exe)
        - ZIP (single exe)
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Search bar
        - Local drives
        - Network shares
        - Settings or first start
        - Storage analysis
        - Duplicates
        - Image text or screenshot history
        - Update or installer
        - Other
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: Steps to reproduce, what you saw, what should have happened.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines (optional)
      description: |
        `%LOCALAPPDATA%\FileDetective\filedetective.log` (Settings > About has a button to open the folder).
        The log contains paths; remove anything private before pasting.
      render: text
